name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plugin:
    name: plugin (validate, test)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install Claude Code
        run: |
          npm install -g @anthropic-ai/claude-code
          claude --version
      # Both run offline: validate reads the manifest and module source, test runs
      # tests/*.test.ts(x) against a stub engine. Neither needs an API key.
      - name: claude plugin validate
        run: claude plugin validate .
      - name: claude plugin test
        run: claude plugin test .
